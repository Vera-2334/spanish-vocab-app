<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>闪卡学习 — 西语单词记忆</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-primary: #FFFFFF;
    --bg-secondary: #F7F7F7;
    --action-primary: #2264D1;
    --action-primary-dark: #1A4FA8;
    --action-hover: #296CD8;
    --action-secondary: #0D9488;
    --action-secondary-dark: #0A7369;
    --accent: #D97706;
    --error: #B91C1C;
    --error-dark: #991B1B;
    --text-primary: #4B4B4B;
    --text-secondary: #AFAFAF;
    --border: #E5E5E5;
    --radius-card: 16px;
    --radius-button: 9999px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', 'PingFang SC', 'HarmonyOS Sans SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg-secondary);
    color: var(--text-primary);
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    touch-action: manipulation;
  }

  .app { max-width: 100%; margin: 0 auto; }

  /* ===== TOP BAR ===== */
  .topbar {
    position: sticky; top: 0; z-index: 30; background: var(--bg-secondary);
    display: flex; align-items: center; padding: 12px 16px; gap: 12px;
  }
  .icon-btn {
    width: 44px; height: 44px; border-radius: 12px;
    border: 2px solid var(--border); background: var(--bg-primary);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 150ms; flex-shrink: 0;
    color: var(--text-secondary); text-decoration: none;
  }
  .icon-btn:hover { border-color: var(--action-secondary); color: var(--action-secondary); }
  .icon-btn svg { width: 20px; height: 20px; }
  .icon-btn.starred { color: var(--accent); border-color: var(--accent); }
  .icon-btn.starred svg { fill: var(--accent); }
  .topbar-center { flex: 1; text-align: center; min-width: 0; }
  .topbar-title { font-size: 16px; font-weight: 700; line-height: 1.2; }
  .topbar-sub { font-size: 13px; color: var(--text-secondary); }

  /* ===== MODE TAGS ===== */
  .mode-row { display: flex; gap: 8px; padding: 0 16px 8px; }
  .mode-tag {
    padding: 6px 14px; border-radius: var(--radius-button);
    border: 2px solid var(--border); background: var(--bg-primary);
    font-size: 13px; font-weight: 600; color: var(--text-secondary);
    cursor: pointer; transition: all 150ms; font-family: inherit;
  }
  .mode-tag.on { background: var(--action-primary); color: #fff; border-color: var(--action-primary); }

  /* ===== FLASHCARD AREA ===== */
  .card-area {
    padding: 8px 16px 16px;
    display: flex; flex-direction: column; align-items: center;
    /* On mobile: card fills width. On desktop: limit card width */
  }
  .card-scene { width: 100%; max-width: 400px; perspective: 1000px; }
  .card-body {
    width: 100%; aspect-ratio: 3/4; max-height: 480px;
    position: relative; cursor: pointer;
    transform-style: preserve-3d; transition: transform 400ms ease-in-out;
  }
  .card-body.flipped { transform: rotateY(180deg); }

  .card-face {
    position: absolute; inset: 0;
    background: var(--bg-primary); border: 2px solid var(--border);
    border-radius: var(--radius-card); backface-visibility: hidden;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 24px 20px; overflow: hidden;
  }
  .card-face.front { z-index: 2; }
  .card-face.back { transform: rotateY(180deg); justify-content: flex-start; overflow-y: auto; }

  /* Front */
  .front-word { font-size: clamp(26px, 5.5vw, 36px); font-weight: 800; text-align: center; line-height: 1.3; word-break: break-word; }
  .pron-btn {
    display: inline-flex; align-items: center; gap: 6px; margin-top: 28px;
    padding: 10px 18px; border: 2px solid var(--border); border-radius: var(--radius-button);
    background: var(--bg-primary); color: var(--action-secondary);
    font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer;
    transition: all 150ms;
  }
  .pron-btn:hover { border-color: var(--action-secondary); background: #F0FDFA; }
  .pron-btn.playing { background: var(--action-secondary); color: #fff; border-color: var(--action-secondary); }
  .pron-btn svg { width: 16px; height: 16px; }
  .flip-hint { margin-top: 28px; font-size: 13px; color: var(--text-secondary); display: flex; align-items: center; gap: 4px; }
  .flip-hint svg { width: 14px; height: 14px; }

  /* Back */
  .back-pos { font-size: 13px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .back-meaning { font-size: 24px; font-weight: 800; margin-bottom: 16px; text-align: center; }
  .back-div { width: 40px; height: 2px; background: var(--border); border-radius: 1px; margin: 0 auto 16px; }
  .back-example {
    width: 100%; background: var(--bg-secondary); border-radius: 12px;
    padding: 14px; text-align: left; margin-bottom: 10px;
  }
  .back-ex-es { font-size: 15px; font-weight: 600; font-style: italic; line-height: 1.55; }
  .back-ex-zh { font-size: 13px; color: var(--text-secondary); margin-top: 8px; line-height: 1.5; }
  .back-src {
    display: inline-flex; align-items: center; gap: 4px; font-size: 11px;
    color: var(--text-secondary); margin-top: 8px;
    background: var(--bg-primary); padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border);
  }
  .back-conj { width: 100%; font-size: 12px; color: var(--text-secondary); text-align: center; line-height: 1.6; margin-top: 8px; }
  .back-conj strong { color: var(--action-primary); }

  /* ===== ANSWER BUTTONS ===== */
  .answer-row { display: flex; gap: 12px; padding: 4px 16px 12px; }
  .ans-btn {
    flex: 1; height: 52px; border: none; border-radius: var(--radius-button);
    font-size: 16px; font-weight: 700; font-family: inherit; color: #fff;
    cursor: pointer; transition: all 100ms ease-out;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .ans-btn svg { width: 18px; height: 18px; }
  .ans-btn.no  { background: var(--error); border-bottom: 4px solid var(--error-dark); }
  .ans-btn.yes { background: var(--action-primary); border-bottom: 4px solid var(--action-primary-dark); }
  .ans-btn.no:hover  { background: #C71E1E; }
  .ans-btn.yes:hover { background: var(--action-hover); }
  .ans-btn:active { border-bottom-width: 0; transform: translateY(4px); }
  .ans-btn:focus-visible { outline: 2px solid var(--action-primary); outline-offset: 2px; }

  /* ===== KBD HINTS ===== */
  .kbd-row { display: flex; justify-content: center; gap: 14px; font-size: 11px; color: var(--text-secondary); padding-bottom: 4px; }
  .kbd { display: inline-block; min-width: 20px; text-align: center; padding: 1px 5px; border: 1px solid var(--border); border-radius: 3px; background: var(--bg-primary); font-size: 10px; font-weight: 700; margin: 0 1px; }

  /* ===== BOTTOM NAV ===== */
  .bottom-nav {
    display: flex; position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--bg-primary); border-top: 1px solid var(--border);
    height: 64px; z-index: 40; padding-bottom: env(safe-area-inset-bottom, 0);
  }
  .bn-item {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 3px;
    color: var(--text-secondary); text-decoration: none;
    font-size: 10px; font-weight: 600; cursor: pointer;
    transition: color 200ms;
  }
  .bn-item svg { width: 24px; height: 24px; transition: transform 200ms; }
  .bn-item.on { color: var(--action-primary); }
  .bn-item.on svg { transform: scale(1.1); }

  /* ===== RESPONSIVE: DESKTOP ===== */
  @media (min-width: 768px) {
    .app { display: flex; min-height: 100vh; max-width: 1152px; }

    /* Sidebar */
    .sidebar {
      display: flex; flex-direction: column;
      width: 240px; flex-shrink: 0; position: sticky; top: 0; height: 100vh;
      background: var(--bg-primary); border-right: 1px solid var(--border);
      z-index: 20;
    }
    .sb-logo { height: 64px; display: flex; align-items: center; padding: 0 16px; font-size: 17px; font-weight: 800; color: var(--action-primary); letter-spacing: -0.3px; }
    .sb-nav { flex: 1; padding: 8px; display: flex; flex-direction: column; gap: 1px; overflow-y: auto; }
    .sb-item {
      display: flex; align-items: center; gap: 10px; height: 44px;
      padding: 0 14px; border-radius: 10px; font-size: 15px; font-weight: 500;
      color: var(--text-primary); text-decoration: none; cursor: pointer;
      transition: background 150ms;
    }
    .sb-item:hover { background: var(--bg-secondary); }
    .sb-item.on { background: var(--bg-secondary); color: var(--action-primary); font-weight: 700; }
    .sb-item svg { width: 18px; height: 18px; flex-shrink: 0; }
    .sb-div { height: 1px; background: var(--border); margin: 6px 10px; }
    .sb-label { font-size: 10px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; padding: 6px 14px 2px; }

    .main-area { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
    .topbar { padding: 16px 24px; }
    .mode-row { padding: 0 24px 8px; }
    .card-area { flex: 1; padding: 16px 24px; justify-content: center; }
    .card-body { max-height: 460px; }
    .answer-row { padding: 12px 24px; max-width: 448px; margin: 0 auto; width: 100%; }
    .kbd-row { padding-bottom: 24px; }
    .bottom-nav { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    .card-body.flipped { transform: none; }
    .card-body.flipped .front { visibility: hidden; }
  }
</style>
</head>
<body>

<div class="app">

  <!-- ===== SIDEBAR (desktop) ===== -->
  <aside class="sidebar" style="display:none;">
    <div class="sb-logo">🇪🇸 西语单词</div>
    <nav class="sb-nav">
      <a class="sb-item" href="dashboard.html">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
        仪表盘
      </a>
      <a class="sb-item">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        单词列表
      </a>
      <a class="sb-item on">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        学习
      </a>
      <a class="sb-item">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        统计
      </a>
    </nav>
  </aside>

  <!-- ===== MAIN AREA ===== -->
  <div class="main-area">

    <!-- Top Bar -->
    <div class="topbar">
      <a class="icon-btn" href="dashboard.html" aria-label="返回">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
      </a>
      <div class="topbar-center">
        <div class="topbar-title">闪卡模式</div>
        <div class="topbar-sub" id="progress">12 / 50</div>
      </div>
      <button class="icon-btn" id="starBtn" onclick="toggleStar()" aria-label="星标">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      </button>
    </div>

    <!-- Mode Tags -->
    <div class="mode-row" id="modeOpts">
      <button class="mode-tag on">西 → 中</button>
      <button class="mode-tag">中 → 西</button>
      <button class="mode-tag">听音辨义</button>
    </div>

    <!-- Card -->
    <div class="card-area">
      <div class="card-scene">
        <div class="card-body" id="cardBody" onclick="flip()">
          <div class="card-face front">
            <div class="front-word" id="frontWord">el problema</div>
            <button class="pron-btn" id="pronBtn" onclick="event.stopPropagation();pronounce()">
              <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
              点击发音
            </button>
            <div class="flip-hint">
              <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polyline points="7 13 12 18 17 13"/><polyline points="7 6 12 11 17 6"/></svg>
              点击卡片翻转
            </div>
          </div>
          <div class="card-face back" id="backFace">
            <div class="back-pos" id="backPos">名词-阳性 (nm)</div>
            <div class="back-meaning" id="backMeaning">问题；难题</div>
            <div class="back-div"></div>
            <div class="back-example">
              <div class="back-ex-es" id="backExEs">"El problema es que no tenemos suficiente tiempo para terminar el proyecto."</div>
              <div class="back-ex-zh" id="backExZh">「问题是我们没有足够的时间来完成这个项目。」</div>
              <div class="back-src" id="backSrc">📚 Tatoeba 语料库</div>
            </div>
            <div class="back-conj" id="backConj" style="display:none;"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Answer Buttons -->
    <div class="answer-row">
      <button class="ans-btn no" onclick="answer('forgot')">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        不记得
      </button>
      <button class="ans-btn yes" onclick="answer('remembered')">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
        记得
      </button>
    </div>

    <!-- Keyboard Hints -->
    <div class="kbd-row">
      <span><span class="kbd">←</span> 不记得</span>
      <span><span class="kbd">→</span> 记得</span>
      <span><span class="kbd">Space</span> 翻转</span>
      <span><span class="kbd">S</span> 星标</span>
    </div>

  </div>

  <!-- ===== BOTTOM NAV (mobile) ===== -->
  <nav class="bottom-nav">
    <a class="bn-item" href="dashboard.html">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
      仪表盘
    </a>
    <a class="bn-item">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      单词
    </a>
    <a class="bn-item on">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      学习
    </a>
    <a class="bn-item">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      统计
    </a>
    <a class="bn-item">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      设置
    </a>
  </nav>

</div>

<script>
let isFlipped = false, isStarred = false, idx = 12, total = 50;

const words = [
  { spanish:'el problema', pos:'名词-阳性 (nm)', meaning:'问题；难题', exEs:'"El problema es que no tenemos suficiente tiempo para terminar el proyecto."', exZh:'「问题是我们没有足够的时间来完成这个项目。」', src:'Tatoeba 语料库', verb:false },
  { spanish:'la solución', pos:'名词-阴性 (nf)', meaning:'解决方案', exEs:'"La solución al problema era más simple de lo que pensábamos."', exZh:'「问题的解决方案比我们想的要简单。」', src:'Tatoeba 语料库', verb:false },
  { spanish:'hablar', pos:'动词 (v)', meaning:'说话；讲', exEs:'"Ella habla tres idiomas con fluidez."', exZh:'「她能流利地讲三种语言。」', src:'Tatoeba 语料库', verb:true, conj:'hablo, hablas, habla, hablamos, habláis, hablan' },
  { spanish:'bueno', pos:'形容词 (adj)', meaning:'好的；善良的', exEs:'"Este libro es muy bueno, te lo recomiendo."', exZh:'「这本书非常好，我推荐给你。」', src:'Tatoeba 语料库', verb:false },
  { spanish:'rápidamente', pos:'副词 (adv)', meaning:'快速地', exEs:'"El niño aprendió a leer rápidamente."', exZh:'「这个孩子很快就学会了阅读。」', src:'Tatoeba 语料库', verb:false },
];

function flip() {
  isFlipped = !isFlipped;
  document.getElementById('cardBody').classList.toggle('flipped', isFlipped);
}

function pronounce() {
  const btn = document.getElementById('pronBtn');
  const word = document.getElementById('frontWord').textContent.replace(/^(el|la|los|las|un|una|unos|unas)\s+/i, '');
  if (!('speechSynthesis' in window)) { btn.textContent='⚠ 不支持'; setTimeout(()=>{btn.innerHTML='<svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>点击发音';},1500); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(word);
  u.lang='es-ES'; u.rate=0.85;
  btn.classList.add('playing');
  u.onend = u.onerror = ()=>btn.classList.remove('playing');
  speechSynthesis.speak(u);
}

function toggleStar() {
  isStarred = !isStarred;
  document.getElementById('starBtn').classList.toggle('starred', isStarred);
}

function answer(type) {
  if (isFlipped) { isFlipped=false; document.getElementById('cardBody').classList.remove('flipped'); }
  const body = document.getElementById('cardBody');
  body.style.transform = type==='remembered' ? 'scale(1.03)' : 'scale(0.97)';
  setTimeout(()=>{ body.style.transform=''; },150);
  setTimeout(()=>{
    idx = (idx % total) + 1;
    document.getElementById('progress').textContent = idx+' / '+total;
    const w = words[Math.floor(Math.random()*words.length)];
    document.getElementById('frontWord').textContent = w.spanish;
    document.getElementById('backPos').textContent = w.pos;
    document.getElementById('backMeaning').textContent = w.meaning;
    document.getElementById('backExEs').textContent = w.exEs;
    document.getElementById('backExZh').textContent = w.exZh;
    document.getElementById('backSrc').textContent = '📚 '+w.src;
    const conj = document.getElementById('backConj');
    if (w.verb) { conj.style.display=''; conj.innerHTML='⚠️ <strong>不规则变位</strong>：'+w.conj; }
    else { conj.style.display='none'; }
  },200);
}

// Keyboard
document.addEventListener('keydown', e => {
  if (e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
  if (e.key===' ') { e.preventDefault(); flip(); }
  else if (e.key==='ArrowLeft') { e.preventDefault(); answer('forgot'); }
  else if (e.key==='ArrowRight') { e.preventDefault(); answer('remembered'); }
  else if (e.key==='s'||e.key==='S') { e.preventDefault(); toggleStar(); }
});

// Mode tags
document.querySelectorAll('.mode-tag').forEach(t=>{ t.onclick=function(){ document.querySelectorAll('.mode-tag').forEach(x=>x.classList.remove('on')); this.classList.add('on'); }; });

// Touch swipe (when flipped, swipe to answer)
let tx=0;
document.querySelector('.card-scene').addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
document.querySelector('.card-scene').addEventListener('touchend',e=>{ if(!isFlipped)return; const dx=e.changedTouches[0].clientX-tx; if(Math.abs(dx)>80) answer(dx>0?'remembered':'forgot'); });

// Sidebar toggle
(function(){ const sb=document.querySelector('.sidebar'); function u(){ sb.style.display=window.innerWidth>=768?'flex':'none'; } u(); window.addEventListener('resize',u); })();
</script>
