<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>仪表盘 — 西语单词记忆</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-primary: #FFFFFF;
    --bg-secondary: #F7F7F7;
    --action-primary: #2264D1;
    --action-primary-dark: #1A4FA8;
    --action-hover: #296CD8;
    --action-secondary: #0D9488;
    --action-secondary-dark: #0A7369;
    --accent: #D97706;
    --error: #B91C1C;
    --error-dark: #991B1B;
    --text-primary: #4B4B4B;
    --text-secondary: #AFAFAF;
    --border: #E5E5E5;
    --radius-card: 16px;
    --radius-button: 9999px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', 'PingFang SC', 'HarmonyOS Sans SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg-secondary);
    color: var(--text-primary);
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  /* ============ MOBILE-FIRST LAYOUT ============ */

  .app { max-width: 100%; margin: 0 auto; }

  /* Header */
  .header {
    position: sticky; top: 0; z-index: 30;
    background: var(--bg-secondary);
    padding: 20px 16px 12px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .header h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.3px; }

  .icon-btn {
    width: 44px; height: 44px; border-radius: 12px;
    border: 2px solid var(--border); background: var(--bg-primary);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 150ms;
    color: var(--text-secondary);
  }
  .icon-btn:hover { border-color: var(--action-secondary); color: var(--action-secondary); }
  .icon-btn svg { width: 22px; height: 22px; }

  /* Main scroll */
  .content { padding: 0 16px 96px; }

  /* Card */
  .card {
    background: var(--bg-primary); border: 2px solid var(--border);
    border-radius: var(--radius-card); padding: 20px; margin-bottom: 16px;
  }
  .card-title { font-size: 17px; font-weight: 700; margin-bottom: 16px; }

  /* Streak */
  .streak-row {
    display: flex; align-items: center; gap: 14px;
    background: var(--bg-primary); border: 2px solid var(--border);
    border-radius: var(--radius-card); padding: 18px 20px; margin-bottom: 16px;
  }
  .streak-flame {
    width: 52px; height: 52px; border-radius: 50%; background: #FEF3C7;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .streak-flame svg { width: 26px; height: 26px; color: var(--accent); }
  .streak-num { font-size: 26px; font-weight: 800; color: var(--accent); line-height: 1.1; }
  .streak-label { font-size: 13px; color: var(--text-secondary); }
  .streak-right { margin-left: auto; text-align: right; }
  .streak-best { font-size: 18px; font-weight: 700; }
  .streak-best-label { font-size: 12px; color: var(--text-secondary); }

  /* Stats grid */
  .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 16px; }
  .stat-card {
    background: var(--bg-primary); border: 2px solid var(--border);
    border-radius: var(--radius-card); padding: 16px; text-align: center;
  }
  .stat-val { font-size: 24px; font-weight: 800; color: var(--action-primary); line-height: 1.2; }
  .stat-lbl { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
  .stat-card.warn .stat-val { color: var(--accent); }
  .stat-card.teal .stat-val { color: var(--action-secondary); }

  /* Heatmap */
  .hm-grid { display: flex; gap: 3px; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
  .hm-week { display: flex; flex-direction: column; gap: 3px; flex-shrink: 0; }
  .hm-cell { width: 11px; height: 11px; border-radius: 2px; flex-shrink: 0; }
  .hm-cell.h0 { background: #E5E5E5; } .hm-cell.h1 { background: #C5D5F0; }
  .hm-cell.h2 { background: #7B9FDB; } .hm-cell.h3 { background: #2264D1; }
  .hm-cell.h4 { background: #153E82; }
  .hm-legend { display: flex; align-items: center; gap: 4px; margin-top: 12px; justify-content: flex-end; font-size: 11px; color: var(--text-secondary); }
  .hm-lg { width: 11px; height: 11px; border-radius: 2px; }

  /* Ring chart */
  .ring-wrap { display: flex; align-items: center; gap: 20px; justify-content: center; flex-wrap: wrap; }
  .ring-legend { display: flex; flex-direction: column; gap: 10px; }
  .ring-item { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .ring-dot { width: 10px; height: 10px; border-radius: 50%; }
  .ring-dot.a { background: var(--action-primary); } .ring-dot.b { background: var(--action-secondary); }
  .ring-v { font-weight: 700; margin-left: 8px; }

  /* CTA */
  .cta-link { text-decoration: none; display: block; margin-bottom: 16px; }
  .cta-btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; height: 56px; background: var(--action-primary); color: #fff;
    font-size: 16px; font-weight: 700; font-family: inherit;
    border: none; border-bottom: 4px solid var(--action-primary-dark);
    border-radius: var(--radius-button); cursor: pointer;
    transition: all 100ms ease-out;
  }
  .cta-btn:hover { background: var(--action-hover); }
  .cta-btn:active { border-bottom-width: 0; transform: translateY(4px); }
  .cta-sub { font-weight: 500; opacity: 0.85; font-size: 14px; }

  /* Countdown */
  .cd-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; font-size: 14px; }
  .cd-header strong { font-size: 18px; color: var(--action-primary); }
  .progress-bar { height: 14px; background: var(--border); border-radius: 9999px; overflow: hidden; margin-bottom: 8px; }
  .progress-fill { height: 100%; background: var(--action-primary); border-radius: 9999px; width: 65%; transition: width 500ms ease-out; }
  .cd-stats { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-secondary); }
  .cd-stats strong { color: var(--text-primary); }

  /* Bottom nav */
  .bottom-nav {
    display: flex; position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--bg-primary); border-top: 1px solid var(--border);
    height: 64px; z-index: 40; padding-bottom: env(safe-area-inset-bottom, 0);
  }
  .bn-item {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 3px;
    color: var(--text-secondary); text-decoration: none;
    font-size: 10px; font-weight: 600; cursor: pointer;
    transition: color 200ms;
  }
  .bn-item svg { width: 24px; height: 24px; transition: transform 200ms; }
  .bn-item.on { color: var(--action-primary); }
  .bn-item.on svg { transform: scale(1.1); }

  /* ============ DESKTOP (≥ 768px) ============ */
  @media (min-width: 768px) {
    .app {
      display: flex; min-height: 100vh;
      max-width: 1152px; /* sidebar 240 + content 672 + gaps */
    }

    /* Sidebar */
    .sidebar {
      display: flex; flex-direction: column;
      width: 240px; flex-shrink: 0; position: sticky; top: 0; height: 100vh;
      background: var(--bg-primary); border-right: 1px solid var(--border);
      padding: 0; z-index: 20;
    }
    .sb-logo {
      height: 64px; display: flex; align-items: center; padding: 0 16px;
      font-size: 17px; font-weight: 800; color: var(--action-primary);
      letter-spacing: -0.3px;
    }
    .sb-nav { flex: 1; padding: 8px; display: flex; flex-direction: column; gap: 1px; overflow-y: auto; }
    .sb-item {
      display: flex; align-items: center; gap: 10px; height: 44px;
      padding: 0 14px; border-radius: 10px; font-size: 15px; font-weight: 500;
      color: var(--text-primary); text-decoration: none; cursor: pointer;
      transition: background 150ms;
    }
    .sb-item:hover { background: var(--bg-secondary); }
    .sb-item.on { background: var(--bg-secondary); color: var(--action-primary); font-weight: 700; }
    .sb-item svg { width: 18px; height: 18px; flex-shrink: 0; }
    .sb-div { height: 1px; background: var(--border); margin: 6px 10px; }
    .sb-label { font-size: 10px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; padding: 6px 14px 2px; }

    /* Content area */
    .main-area { flex: 1; overflow-y: auto; }
    .header { position: sticky; top: 0; padding: 24px 24px 16px; }
    .content { padding: 0 24px 40px; max-width: 672px; }

    .bottom-nav { display: none; }

    /* 2-column row for heatmap + ring */
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .two-col .card { margin-bottom: 0; }

    .stats-grid { grid-template-columns: repeat(4, 1fr); }

    .hm-grid { overflow-x: visible; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
</style>

<script>
(function() {
  const el = document.getElementById('heatmap');
  const weeks = 27, dpw = 7, today = new Date(), ms = 86400000;
  const start = new Date(today - (weeks * dpw - 1) * ms);
  let h = '';
  for (let w = 0; w < weeks; w++) {
    h += '<div class="hm-week">';
    for (let d = 0; d < dpw; d++) {
      const dt = new Date(start.getTime() + (w * dpw + d) * ms);
      const seed = (dt.getFullYear()*1000+(dt.getMonth()+1)*50+dt.getDate())%17;
      let lv = 0;
      if (dt <= today) {
        if (w < 8) lv = seed > 14 ? 2 : seed > 10 ? 1 : 0;
        else if (w < 16) lv = seed > 12 ? 2 : seed > 8 ? 1 : seed > 15 ? 3 : 0;
        else lv = seed > 8 ? 3 : seed > 4 ? 2 : seed > 13 ? 4 : 1;
      }
      h += `<div class="hm-cell h${lv}" title="${dt.toISOString().slice(0,10)}: ${[0,2,8,20,35][lv]}词"></div>`;
    }
    h += '</div>';
  }
  el.innerHTML = h;
})();

// JS to toggle sidebar visibility based on screen width
(function() {
  const sidebar = document.querySelector('.sidebar');
  function updateSidebar() {
    if (window.innerWidth >= 768) sidebar.style.display = 'flex';
    else sidebar.style.display = 'none';
  }
  updateSidebar();
  window.addEventListener('resize', updateSidebar);
})();
</script>

</body>
</html>
